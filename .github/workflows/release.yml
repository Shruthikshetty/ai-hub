name: Release

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      target_os:
        description: 'Target OS to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    if: |
      github.event_name == 'release' ||
      inputs.target_os == 'all' ||
      (inputs.target_os == 'windows' && matrix.os == 'windows-latest') ||
      (inputs.target_os == 'macos' && matrix.os == 'macos-latest') ||
      (inputs.target_os == 'linux' && matrix.os == 'ubuntu-latest')

    permissions:
      contents: write

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: 'bun'

      - name: Install dependencies
        run: bun install

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: bun run build:win

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: bun run build:mac

      - name: Build Linux (x64 and arm64)
        if: matrix.os == 'ubuntu-latest'
        run: bun run build:linux

      - name: Save Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
